
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8">
        <title>Script Knowledge Graph</title>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
            body { margin: 0; font-family: Arial, sans-serif; }
            .links line { stroke: #999; stroke-opacity: 0.6; }
            .nodes circle { stroke: #fff; stroke-width: 1.5px; }
            .character { fill: #66c2a5; }
            .location { fill: #fc8d62; }
            .other { fill: #8da0cb; }  /* New color for other entities */
            .text { font-size: 10px; }
        </style>
    </head>
    <body>
        <svg width="960" height="600"></svg>
        <script>
            // Graph data
            const graph = {
                "nodes": [{"id": "Phoenix", "name": "Phoenix", "type": "character"}, {"id": "Zara", "name": "Zara", "type": "character"}, {"id": "Rory", "name": "RORY", "type": "character"}, {"id": "Enforcer", "name": "ENFORCER", "type": "character"}, {"id": "Maya", "name": "MAYA", "type": "character"}, {"id": "Kai", "name": "KAI", "type": "character"}, {"id": "Catacombs", "name": "CATACOMBS", "type": "location"}, {"id": "Chromatic", "name": "CHROMATIC", "type": "location"}, {"id": "Chromatic Catacombs", "name": "CHROMATIC CATACOMBS", "type": "location"}, {"id": "City", "name": "city", "type": "location"}, {"id": "Sanctuary", "name": "sanctuary", "type": "location"}, {"id": "Street", "name": "STREET", "type": "location"}, {"id": "murals", "name": "murals", "type": "other"}, {"id": "artist", "name": "artist", "type": "other"}, {"id": "Underground Artists", "name": "Underground Artists", "type": "other"}, {"id": "Elderly Artist", "name": "Elderly Artist", "type": "other"}],
                "links": [{"source": "Phoenix", "target": "Chromatic Catacombs", "relationship": "lives in"}, {"source": "Phoenix", "target": "Enforcer", "relationship": "opposed by"}, {"source": "Phoenix", "target": "Chromatic Catacombs", "relationship": "creates art in"}, {"source": "Phoenix", "target": "murals", "relationship": "creates"}, {"source": "Phoenix", "target": "Chromatic Catacombs", "relationship": "hides in"}, {"source": "Phoenix", "target": "Chromatic Catacombs", "relationship": "is pursued in"}, {"source": "Phoenix", "target": "artist", "relationship": "is a"}, {"source": "Phoenix", "target": "Underground Artists", "relationship": "leads"}, {"source": "Phoenix", "target": "Kai", "relationship": "is friends with"}, {"source": "Phoenix", "target": "Maya", "relationship": "is friends with"}, {"source": "Phoenix", "target": "Zara", "relationship": "is inspired by"}, {"source": "Phoenix", "target": "Rory", "relationship": "works with"}, {"source": "Zara", "target": "Elderly Artist", "relationship": "is a"}, {"source": "Zara", "target": "Phoenix", "relationship": "inspires"}, {"source": "Chromatic Catacombs", "target": "Sanctuary", "relationship": "is a"}, {"source": "Rory", "target": "Phoenix", "relationship": "helps"}]
            };
            
            const svg = d3.select("svg"),
                width = +svg.attr("width"),
                height = +svg.attr("height");
            
            // Create simulation
            const simulation = d3.forceSimulation()
                .nodes(graph.nodes)
                .force("link", d3.forceLink(graph.links).id(d => d.id).distance(100))
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(width / 2, height / 2));
            
            // Create links
            const link = svg.append("g")
                .attr("class", "links")
                .selectAll("line")
                .data(graph.links)
                .enter().append("line");
            
            // Create nodes
            const node = svg.append("g")
                .attr("class", "nodes")
                .selectAll("g")
                .data(graph.nodes)
                .enter().append("g");
            
            node.append("circle")
                .attr("r", 8)
                .attr("class", d => d.type)
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));
            
            node.append("text")
                .attr("class", "text")
                .attr("dx", 12)
                .attr("dy", ".35em")
                .text(d => d.name);
            
            // Add relationship labels
            svg.append("g")
                .attr("class", "texts")
                .selectAll("text")
                .data(graph.links)
                .enter().append("text")
                .attr("class", "text")
                .attr("fill", "#666")
                .text(d => d.relationship);
            
            // Update positions
            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);
                
                node.attr("transform", d => `translate(${d.x},${d.y})`);
                
                svg.selectAll(".texts text")
                    .attr("x", d => (d.source.x + d.target.x) / 2)
                    .attr("y", d => (d.source.y + d.target.y) / 2);
            });
            
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
        </script>
    </body>
    </html>
